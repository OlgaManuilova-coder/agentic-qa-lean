# GitLab CI for the lean template.
#   validate  — data and code gates on every merge request (no secrets needed)
#   specs     — promoted deterministic Playwright specs against SauceDemo
#   agentic   — OPTIONAL: a headless Claude Code smoke run. Manual / scheduled only, and only when the
#               masked CI/CD variable ANTHROPIC_API_KEY exists (Settings → CI/CD → Variables).

stages: [validate, specs, agentic]

default:
  image: node:22
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline || npm install --cache .npm

variables:
  TEST_ENV: saucedemo

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

env-and-suites:
  stage: validate
  script:
    - npm run env:check
    - npm run suites:lint
    - npm run suites:list
    - npm run review:tests        # advisory: candidates for /qa-review-tests
    - npm run prompt:facts -- all # advisory: candidates for /prompt-review

unit:
  stage: validate
  script:
    - npm test

playwright-specs:
  stage: specs
  image: mcr.microsoft.com/playwright:v1.65.1-noble
  script:
    - npm run specs:run
  artifacts:
    when: always
    expire_in: 14 days
    paths: [playwright-report/, results/]
    reports:
      junit: results/junit.xml

agentic-smoke:
  stage: agentic
  image: mcr.microsoft.com/playwright:v1.65.1-noble
  rules:
    - if: $ANTHROPIC_API_KEY && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
      when: manual
      allow_failure: true
  script:
    - npm install -g @anthropic-ai/claude-code
    # Headless lanes in CI: flip headless=false -> true in the lane configs for this job only.
    - |
      sed -i 's/"headless": false/"headless": true/' config/mcp-playwright-*.config.json
    - >
      claude -p "/qa-smoke"
      --output-format json
      --max-turns 80
      --allowedTools "Read,Write,Edit,Glob,Grep,Task,Bash(npm run *),mcp__playwright-chrome"
      > results-smoke.json
    - cat results-smoke.json | head -c 4000
  artifacts:
    when: always
    expire_in: 14 days
    paths: [results/, results-smoke.json]
