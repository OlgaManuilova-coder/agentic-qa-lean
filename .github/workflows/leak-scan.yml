# Public repository: fail any push or pull request that carries private material (see scripts/leak-scan.mjs).
name: leak-scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  leak-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run leak:scan
